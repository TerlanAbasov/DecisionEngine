                            -   column:
                                    name: dry_run
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: reason
                                    type: TEXT
                            -   column:
                                    name: target_qty
                                    type: DOUBLE PRECISION
                            -   column:
                                    name: position_before
                                    type: DOUBLE PRECISION
                -   createIndex:
                        tableName: live_order
                        indexName: ix_live_order_submitted
                        columns:
                            -   column:
                                    name: submitted_at
                -   createTable:
                        tableName: live_cycle
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: started_at
                                    type: TIMESTAMP
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: finished_at
                                    type: TIMESTAMP
                            -   column:
                                    name: status
                                    type: VARCHAR(16)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: mode
                                    type: VARCHAR(12)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: triggered_by
                                    type: VARCHAR(12)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: dry_run
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: message
                                    type: TEXT
                            -   column:
                                    name: symbols
                                    type: INTEGER
                            -   column:
                                    name: strategies
                                    type: INTEGER
                            -   column:
                                    name: signals
                                    type: INTEGER
                            -   column:
