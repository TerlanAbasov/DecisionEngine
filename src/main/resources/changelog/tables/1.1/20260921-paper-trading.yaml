databaseChangeLog:
    -   changeSet:
            id: 20260921-paper-trading
            author: Tarlan Abasov
            comment: >
                Paper (demo-account) trading job. live_config is the single editable settings row;
                live_slot is the virtual position of each strategy in each symbol (Alpaca nets positions
                per symbol, so per-strategy results are tracked here); live_trade are the closed virtual
                trades; live_order the orders sent to Alpaca; live_cycle the job's run log; live_equity and
                live_strategy_pnl the account and per-strategy curves. Everything is new, nothing existing changes.
            changes:
                -   createTable:
                        tableName: live_config
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: enabled
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: dry_run
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: interval_seconds
                                    type: INTEGER
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: allocation_usd
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: position_size
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: allow_short
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: timeframe_mode
                                    type: VARCHAR(16)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: lookback_bars
                                    type: INTEGER
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: strategy_names
                                    type: TEXT
                            -   column:
                                    name: symbols
                                    type: TEXT
                            -   column:
                                    name: max_gross_usd
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: max_orders_per_cycle
                                    type: INTEGER
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: market_hours_only
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: fill_timeout_seconds
                                    type: INTEGER
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: use_risk_defaults
                                    type: BOOLEAN
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: updated_at
                                    type: TIMESTAMP
                -   createTable:
                        tableName: live_slot
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: strategy
                                    type: VARCHAR(255)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: symbol
                                    type: VARCHAR(32)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: direction
                                    type: INTEGER
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: qty
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: entry_price
                                    type: DOUBLE PRECISION
                            -   column:
                                    name: entry_time
                                    type: TIMESTAMP
                            -   column:
                                    name: blocked_dir
                                    type: INTEGER
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: last_signal
                                    type: DOUBLE PRECISION
                            -   column:
                                    name: last_signal_at
                                    type: TIMESTAMP
                            -   column:
                                    name: last_price
                                    type: DOUBLE PRECISION
                            -   column:
                                    name: realized_pnl
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: updated_at
                                    type: TIMESTAMP
                -   createIndex:
                        tableName: live_slot
                        indexName: uk_live_slot
                        unique: true
                        columns:
                            -   column:
                                    name: strategy
                            -   column:
                                    name: symbol
                -   createTable:
                        tableName: live_trade
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: strategy
                                    type: VARCHAR(255)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: symbol
                                    type: VARCHAR(32)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: side
                                    type: VARCHAR(8)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: qty
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: entry_time
                                    type: TIMESTAMP
                            -   column:
                                    name: entry_price
                                    type: DOUBLE PRECISION
                                    constraints:
