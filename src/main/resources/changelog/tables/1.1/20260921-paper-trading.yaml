                                    constraints:
                                        nullable: false
                            -   column:
                                    name: exit_price
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: pnl_usd
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: return_pct
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: exit_reason
                                    type: VARCHAR(24)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: cycle_id
                                    type: BIGINT
                -   createIndex:
                        tableName: live_trade
                        indexName: ix_live_trade_strategy
                        columns:
                            -   column:
                                    name: strategy
                -   createIndex:
                        tableName: live_trade
                        indexName: ix_live_trade_exit
                        columns:
                            -   column:
                                    name: exit_time
                -   createTable:
                        tableName: live_order
                        columns:
                            -   column:
                                    name: id
                                    type: BIGINT
                                    autoIncrement: true
                                    constraints:
                                        primaryKey: true
                                        nullable: false
                            -   column:
                                    name: cycle_id
                                    type: BIGINT
                            -   column:
                                    name: symbol
                                    type: VARCHAR(32)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: side
                                    type: VARCHAR(8)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: qty
                                    type: DOUBLE PRECISION
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: status
                                    type: VARCHAR(24)
                                    constraints:
                                        nullable: false
                            -   column:
                                    name: alpaca_order_id
                                    type: VARCHAR(64)
                            -   column:
                                    name: client_order_id
                                    type: VARCHAR(80)
                            -   column:
                                    name: filled_qty
