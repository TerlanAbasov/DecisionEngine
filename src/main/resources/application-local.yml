server:
  port: 8082
logging:
  level:
    ROOT: INFO
    com.quant.finance.decision: INFO

spring:
  application:
    name: DecisionEngine
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/quant
    username: ${QUANT_ENGINE_USER}
    password: ${QUANT_ENGINE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Liquibase (see changelog/master.yaml)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:/changelog/master.yaml
  jackson:
    default-property-inclusion: non_null

quantplat:
  backtest:
    threads: 50                 # parallel worker threads for run-all / optimiser / ensemble backtests
    trace-per-symbol: true       # log one line per (strategy x stock) during backtests — set false for big sweeps
    run-all-max-days: 400        # cap the look-back window of a run-all / batch backtest (guards heap on 1-min data)
  default-history-years: 2
  data:
    fresh-days: 4               # a symbol counts as "fresh" if its newest cached bar is within this many days
  alpaca:
    api-key-id: PKSRTKKHKLY76BKUA22MYCYIZG
    api-secret-key: HxRYF5RwFD43zsxetHKZsFPqp4SZbULKjvyY6PhAGDvn
    data-base-url: https://data.alpaca.markets
    feed: iex                    # iex (free) | sip (paid subscription)
    timeframe: 1Min               # 1Day (daily) | 1Week (weekly) | 1Hour (hourly) | 1Min/5Min/15Min (minute)
  poll:
    enabled: true
    interval-ms: 300000           # 5 min — each tick does an incremental fetch (bars since the last cached one)
    initial-delay-ms: 60000
    lookback-days: 2             # how far before the last cached bar the incremental poll re-requests (gap / partial-bar safety)
  execution-engine:
    # Talks only to ExecutionEngine's TradeController (POST /api/v1/trades/command) —
    # its AlertController/TradingView-webhook intake is intentionally not used.
    base-url: ${EXECUTION_ENGINE_URL:}   # e.g. http://localhost:8081 — blank disables forwarding
    # @FeignClient can't take a blank url (it means "resolve by service discovery" and needs
    # a load-balancer bean, which crashes startup without one) — this always resolves to
    # something syntactically valid; ExecutionEngineClient.configured (above) is still what
    # actually gates whether a call is ever made.
    feign-url: ${EXECUTION_ENGINE_URL:http://execution-engine.invalid}
    auto-forward: false                  # true = every new LONG/SHORT signal is pushed automatically
    strategies:                          # comma-separated allow-list; blank = every enabled strategy
    order-type: MKT                      # MKT | LMT | STP | ... (com.ib.client.OrderType names)
    tif: DAY                             # DAY | GTC | IOC | ... (com.ib.client.Types.TimeInForce names)
    quantity:                            # blank = omit from the payload (ExecutionEngine has no sizing on this path yet)
  cors-allowed-origins: http://localhost:8081
