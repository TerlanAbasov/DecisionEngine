spring:
  application:
    name: quantplat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quantplat}
    username: ${DB_USER:quant}
    password: ${DB_PASS:quant}
  jpa:
    hibernate:
      ddl-auto: update          # switch to 'validate' + Flyway migrations for production
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

quantplat:
  data-source: synthetic         # synthetic | ib
  default-history-years: 6.5
  ib:
    host: 127.0.0.1
    port: 7497
    client-id: 17
  cors-allowed-origins: http://localhost:5173

---
# Zero-setup local profile: run with -Dspring.profiles.active=dev to use in-memory H2.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:quantplat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
