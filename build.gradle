plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'checkstyle'
}

group = 'com.quantplat'
version = '0.0.1'
description = 'QuantPlat Backend — quant trading & backtesting platform'

ext {
    // Spring Cloud 2025.1.x (2025.1.2 or later) is the release train paired with Spring Boot 4.1.x.
    springCloudVersion = '2025.1.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.github.openfeign:feign-micrometer'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-annotation-error-decoder'

    implementation 'org.dhatim:fastexcel:0.18.4'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.dhatim:fastexcel-reader:0.18.4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.80.0')
        removeUnusedImports()
        importOrder()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '10.18.2'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

springBoot {
    mainClass = 'com.quant.finance.decision.DecisionEngineApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
